# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# LLM Service production profile - no hardcoded secrets, matching every
# other PaymentX service's application-prod.yml convention exactly.
# LLM_API_KEY/LLM_MODEL/LLM_BASE_URL/LLM_MAX_TOKENS/LLM_TIMEOUT_SECONDS
# are already environment-driven in the base application.yml - nothing
# provider-specific needs overriding here beyond a lower trace sampling
# rate, matching every other PaymentX service's prod profile.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# LLM Service production profile - koi hardcoded secrets nahi, exactly
# har doosri PaymentX service ke application-prod.yml convention se
# match karte hue. LLM_API_KEY/LLM_MODEL/LLM_BASE_URL/LLM_MAX_TOKENS/
# LLM_TIMEOUT_SECONDS already base application.yml me environment-driven
# hain - yahan provider-specific kuch bhi override karne ki zaroorat
# nahi hai, ek lower trace sampling rate ke alawa, har doosri PaymentX
# service ke prod profile se match karte hue.
# ====================================================================

server:
  port: 8093

logging:
  level:
    com.paymentx.llm: INFO

management:
  tracing:
    sampling:
      probability: 0.1
