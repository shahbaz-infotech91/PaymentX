# ENGLISH: Nginx config for serving the built Control Center SPA (Phase
# 6 Docker support). What it does: serves static assets from dist/ with
# a real SPA fallback (any unmatched path returns index.html, so React
# Router's client-side routes like /kafka or /payments work on a hard
# refresh, not just via in-app navigation) and disables caching on
# index.html itself (so a new deploy is picked up immediately, while
# hashed asset files under /assets/ - which Vite content-hashes on
# every build - are safe to cache aggressively).
#
# HINGLISH: Built Control Center SPA serve karne ke liye Nginx config
# (Phase 6 Docker support). Ye kya karti hai: dist/ se static assets
# serve karta hai ek real SPA fallback ke saath (koi bhi unmatched path
# index.html return karta hai, taaki React Router ke client-side routes
# jaise /kafka ya /payments hard refresh par bhi kaam karein, sirf
# in-app navigation se nahi) aur index.html par khud caching disable
# karta hai (taaki ek naya deploy turant pick ho jaaye, jabki /assets/
# ke neeche hashed asset files - jinhe Vite har build par content-hash
# karta hai - aggressively cache karna safe hai).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
