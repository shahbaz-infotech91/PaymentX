# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# This is the Liquibase master changelog for Vector Service. It lists
# every schema-migration changeset in the order they must be applied -
# Liquibase reads this file on startup and runs any changeset not yet
# recorded in its own tracking table, so the database schema always
# matches what this service's entities expect. Runs against the shared
# `paymentx_ai` database (see application-dev.yml) - the same database
# Prompt Service already uses, not a new one (Step 2 of the Phase 3.5
# brief: "Do not create a second PostgreSQL instance"). This service's
# changesets only ever touch ai_document/ai_document_chunk/
# ai_document_embedding (plus activating the pgvector extension itself),
# never a table another AI Platform service owns.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Ye Vector Service ka Liquibase master changelog hai. Isme har
# schema-migration changeset us order me listed hai jisme unhe apply
# hona chahiye - Liquibase startup pe ye file padhti hai aur jo bhi
# changeset abhi tak apply nahi hua use chala deti hai, taaki database
# schema hamesha is service ki entities ke expectations se match kare.
# Shared `paymentx_ai` database ke against chalta hai
# (application-dev.yml dekho) - wahi database jo Prompt Service already
# use karti hai, ek nayi nahi (Phase 3.5 brief ka Step 2: "Ek doosra
# PostgreSQL instance create mat karo"). Is service ke changesets sirf
# ai_document/ai_document_chunk/ai_document_embedding ko touch karte
# hain (plus pgvector extension khud ko activate karna), kisi doosri AI
# Platform service ki table ko kabhi nahi.
# ====================================================================

databaseChangeLog:

  - include:
      file: db/changelog/changes/V1_0_0__create_pgvector_extension.yaml

  - include:
      file: db/changelog/changes/V1_0_1__create_ai_vector_tables.yaml

  - include:
      file: db/changelog/changes/V1_0_2__migrate_embedding_dimension_to_384.yaml
