databaseChangeLog:
  - changeSet:
      id: V1_0_2-seed-report-catalog
      author: reporting-service
      comment: Seeds the 11 report catalog entries so /reports has real data on a fresh environment.
      changes:
        - insert: { tableName: report, columns: [ { column: { name: report_type, value: PAYMENT_SUMMARY } }, { column: { name: display_name, value: "Payment Summary" } }, { column: { name: description, value: "Total, per-status, and per-currency payment counts and amounts" } }, { column: { name: created_by, value: SYSTEM } }, { column: { name: updated_by, value: SYSTEM } } ] }
        - insert: { tableName: report, columns: [ { column: { name: report_type, value: SETTLEMENT_SUMMARY } }, { column: { name: display_name, value: "Settlement Summary" } }, { column: { name: description, value: "Settlement outcomes by status and currency" } }, { column: { name: created_by, value: SYSTEM } }, { column: { name: updated_by, value: SYSTEM } } ] }
        - insert: { tableName: report, columns: [ { column: { name: report_type, value: PARTICIPANT_SUMMARY } }, { column: { name: display_name, value: "Participant Summary" } }, { column: { name: description, value: "Per-participant transaction activity" } }, { column: { name: created_by, value: SYSTEM } }, { column: { name: updated_by, value: SYSTEM } } ] }
        - insert: { tableName: report, columns: [ { column: { name: report_type, value: TRANSACTION_VOLUME } }, { column: { name: display_name, value: "Transaction Volume" } }, { column: { name: description, value: "Overall transaction count and value by currency" } }, { column: { name: created_by, value: SYSTEM } }, { column: { name: updated_by, value: SYSTEM } } ] }
