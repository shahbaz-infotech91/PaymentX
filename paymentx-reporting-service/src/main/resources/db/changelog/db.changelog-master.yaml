# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# This is the Liquibase master changelog for the reporting service.
# It lists every schema-migration changeset in the order they must be
# applied - Liquibase reads this file on startup and runs any
# changeset not yet recorded in its own tracking table, so the
# database schema always matches what this service's entities expect.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Ye reporting service ka Liquibase master changelog hai. Isme har
# schema-migration changeset us order me listed hai jisme unhe apply
# hona chahiye - Liquibase startup pe ye file padhti hai aur jo bhi
# changeset abhi tak apply nahi hua use chala deti hai, taaki database
# schema hamesha is service ki entities ke expectations se match kare.
# ====================================================================

databaseChangeLog:
  - include: { file: db/changelog/changes/V1_0_0__create_source_event_table.yaml }
  - include: { file: db/changelog/changes/V1_0_1__create_report_table.yaml }
  - include: { file: db/changelog/changes/V1_0_2__seed_report_catalog.yaml }
  - include: { file: db/changelog/changes/V1_0_3__create_report_request_table.yaml }
  - include: { file: db/changelog/changes/V1_0_4__create_report_execution_table.yaml }
  - include: { file: db/changelog/changes/V1_0_5__create_report_result_and_metadata_tables.yaml }
  - include: { file: db/changelog/changes/V1_0_6__create_report_schedule_table.yaml }
  - include: { file: db/changelog/changes/V1_0_7__create_report_export_table.yaml }
