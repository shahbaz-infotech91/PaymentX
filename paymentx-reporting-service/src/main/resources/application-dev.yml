# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# This configuration file contains runtime configuration required by
# Reporting Service (local development profile - Postgres/Redis/Kafka on localhost). It configures database, Kafka, Redis, security,
# observability, and application-specific settings this service reads
# on startup - other services never read this file directly, each
# service owns and loads only its own configuration.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Is file me Reporting Service (local development profile - Postgres/Redis/Kafka on localhost) ki runtime configuration hai. Isme
# database, Kafka, Redis, security, observability, aur is service ke
# apne settings hain jo startup pe padhe jaate hain - dusri services
# ye file kabhi seedhe nahi padhti, har service sirf apni configuration
# khud load karti hai.
# ====================================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/paymentx_reporting
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    # Regression-remediation fix: same real, measured root cause as audit-service's own
    # identical comment - HikariCP's unconfigured default (10 max / 10 idle) held 10
    # permanently idle connections against the shared dev Postgres instance regardless of
    # load, contributing to real max_connections exhaustion. Pool tuning only, no business
    # logic change.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: reporting-service
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  tracing:
    enabled: true

logging:
  level:
    org.springframework: INFO
