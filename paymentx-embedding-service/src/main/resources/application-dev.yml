# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# Embedding Service local development profile. Like LLM Service, this
# service has no Postgres/Liquibase section - it is deliberately
# stateless (Step 23 of the Phase 3.4 brief), so there is nothing here
# beyond logging. EMBEDDING_API_KEY is still read from the real
# environment variable (see application.yml's ${EMBEDDING_API_KEY:}
# binding) - a developer running this service locally must export a
# real OpenAI API key themselves; this file does NOT set one, hardcoded
# or otherwise.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Embedding Service local development profile. LLM Service ki tarah, is
# service me koi Postgres/Liquibase section nahi hai - ye jaan-boojh kar
# stateless hai (Phase 3.4 brief ka Step 23), isliye logging ke alawa
# yahan kuch nahi hai. EMBEDDING_API_KEY ab bhi real environment
# variable se hi padha jaata hai (application.yml ka
# ${EMBEDDING_API_KEY:} binding dekho) - is service ko locally chalane
# wale developer ko khud ek real OpenAI API key export karni hogi; ye
# file koi set nahi karti, hardcoded ya kisi aur tarah se.
# ====================================================================

management:
  tracing:
    enabled: true

logging:
  level:
    org.springframework: INFO
