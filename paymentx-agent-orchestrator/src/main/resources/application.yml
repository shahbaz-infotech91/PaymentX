# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# Runtime configuration for Agent Orchestrator. Configures the web
# server, observability, the real downstream AI Platform service URLs
# this agent calls (RAG Service, MCP Gateway, Prompt Service, LLM
# Service), and the bounded execution limits (Step 10) every agent run
# is subject to. Port 8098 is the next free port in the AI Platform
# range after Prompt Service (8092), LLM Service (8093), Embedding
# Service (8094), Vector Service (8095), RAG Service (8096), MCP
# Gateway (8097) - matching the exact port-reassignment precedent every
# prior AI Platform phase already set (each successive phase reuses the
# next free slot in PAYMENTX_PHASE_3_ARCHITECTURE.md §16's original
# 8091-8097 allocation, extended by one).
#
# `agent.mcp-roles` is the fixed, configured, read-only role set Agent
# Orchestrator presents to MCP Gateway on every tool call - its OWN
# service-level grant for the AI Chat feature's read-only lookups, the
# same kind of self-asserted internal-service credential MCP Gateway's
# own McpAuditClient already uses for its audit writes (see that
# class's javadoc in paymentx-mcp-gateway, Phase 3.7). This is
# deliberately never elevated beyond the four real READ permissions
# that exist (PAYMENT_READ/ROUTING_READ/RECONCILIATION_READ/
# AUDIT_READ) - there is no per-dashboard-user role/participant
# identity anywhere in this platform yet (PAYMENTX_PHASE_3_ARCHITECTURE.md
# §1's "no real platform-wide identity system yet" finding), so this is
# an honest, minimal-scope choice, not an invented stronger guarantee.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Agent Orchestrator ki runtime configuration. Web server, observability,
# real downstream AI Platform service URLs jo ye agent call karta hai
# (RAG Service, MCP Gateway, Prompt Service, LLM Service), aur bounded
# execution limits (Step 10) jo har agent run ke saath apply hote hain,
# configure karta hai. Port 8098 AI Platform range ka agla free port hai
# Prompt Service (8092), LLM Service (8093), Embedding Service (8094),
# Vector Service (8095), RAG Service (8096), MCP Gateway (8097) ke baad
# - exactly wahi port-reassignment precedent match karte hue jo har
# pichla AI Platform phase already set kar chuka hai.
#
# `agent.mcp-roles` wo fixed, configured, read-only role set hai jise
# Agent Orchestrator MCP Gateway ko har tool call par present karta hai
# - AI Chat feature ke read-only lookups ke liye uska apna service-level
# grant, wahi kism ka self-asserted internal-service credential jo MCP
# Gateway ka apna McpAuditClient apne audit writes ke liye already use
# karta hai (us class ka javadoc paymentx-mcp-gateway me dekho, Phase
# 3.7). Ye jaan-boojh kar un chaar real READ permissions se kabhi upar
# nahi jaata jo exist karte hain (PAYMENT_READ/ROUTING_READ/
# RECONCILIATION_READ/AUDIT_READ) - is platform me abhi kahin bhi ek
# per-dashboard-user role/participant identity nahi hai
# (PAYMENTX_PHASE_3_ARCHITECTURE.md §1 ka "abhi koi real platform-wide
# identity system nahi hai" finding), isliye ye ek honest, minimal-scope
# choice hai, ek invented stronger guarantee nahi.
# ====================================================================

spring:
  application:
    name: paymentx-agent-orchestrator

  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8098

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.paymentx.agent: DEBUG

paymentx:
  service-name: Agent Orchestrator

agent:
  rag-service-url: http://localhost:8096
  mcp-gateway-url: http://localhost:8097
  prompt-service-url: http://localhost:8092
  llm-service-url: http://localhost:8093
  audit-service-url: http://localhost:8085
  agent-prompt-key: PAYMENTX_AGENT_ORCHESTRATOR

  # Step 10 - configurable, never hardcoded through the code.
  max-iterations: 5
  max-tool-calls: 10
  max-tools-per-iteration: 1
  max-context-characters: 12000
  # Phase 3.9 incremental re-validation fix - was 45000ms. RAG Service's own real budget for a single
  # query is bounded by ITS llm-read-timeout-ms (60000ms, see rag-read-timeout-ms below and RAG's own
  # application.yml) - a single RAG call can legitimately take close to 60s when Anthropic's real API
  # is transiently overloaded and LLM Service's own resilience retry kicks in. Discovered via a real
  # live E2E run in this phase: a genuine (non-erroring) request hit a real Anthropic 529 "Overloaded"
  # response, LLM Service's retry succeeded but took 24.7s/45.7s on two concurrent real calls, and this
  # 45000ms overall budget cut the agent run off as TIMEOUT before RAG's own real, in-flight, eventually-
  # successful response ever came back. 75000ms gives real headroom above a single worst-case RAG call
  # (raised to 65000ms below) without being unbounded - same "downstream budget + headroom" pattern
  # ControlCenterProperties.Ai.readTimeoutMs's own Phase 3.9 fix already established one layer up.
  overall-timeout-ms: 75000

  rag-connect-timeout-ms: 3000
  # Phase 3.9 incremental re-validation fix - was 20000ms, shorter than RAG Service's OWN configured
  # llm-read-timeout-ms (60000ms) for its own downstream LLM call - meaning this client gave up on a
  # healthy, still-working RAG request before RAG's own timeout budget would ever expire. Real root
  # cause and evidence: see overall-timeout-ms's comment above (real Anthropic 529 overload, real
  # RagServiceClient "Read timed out" log lines at exactly ~20s). 65000ms gives real headroom above
  # RAG's own 60000ms budget.
  rag-read-timeout-ms: 65000
  mcp-connect-timeout-ms: 3000
  mcp-read-timeout-ms: 10000
  prompt-connect-timeout-ms: 3000
  prompt-read-timeout-ms: 10000
  llm-connect-timeout-ms: 3000
  llm-read-timeout-ms: 60000

  # See class-level javadoc above - a fixed, minimal, read-only service credential, never per-user.
  mcp-roles: PAYMENT_READ,ROUTING_READ,RECONCILIATION_READ,AUDIT_READ

# Phase 4.1 - the Agent Registry. A sibling of the singular `agent:` block above, not a
# replacement for it: `agent:` still configures the platform-wide defaults (URLs, timeouts,
# resilience) every agent shares; `agents:` configures the set of agents themselves. The
# "default" entry below reproduces Phase 3.8's exact single-agent behavior field-for-field
# (same prompt key, same five-tool allow-list, same iteration/timeout budget by leaving
# max-iterations/timeout-ms unset so AgentOrchestratorService falls back to the `agent:` block's
# platform defaults) - any pre-Phase-4.1 request that omits agentId resolves to this entry and
# behaves identically to before.
#
# Phase 4.2.3 adds the platform's first real business agent, "error-analyzer" - lowercase,
# hyphenated, matching "default"'s own real precedent (the only other agentId value that has
# ever existed), not the task brief's own example "ERROR_ANALYZER" verbatim, for consistency
# with this file's one established naming convention. Its allowed-tools is the same five-tool
# set "default" already has - every real read-only MCP tool this platform has ever registered
# is relevant to investigating a payment failure (payment/audit/routing/reconciliation evidence,
# see PAYMENTX_PHASE_4_2_0_ERROR_ANALYZER_DESIGN.md §4) - so no tool is withheld from it, but
# none beyond the five that exist is added either. prompt-key references PAYMENT_ERROR_ANALYSIS
# version 2 (V1_0_4, Phase 4.2.2) - the version compatible with AgentPlanner's real variable
# contract; version 1 (stale, incompatible) is never referenced by any agent.
#
# Phase 4.3 adds the platform's second business agent, "knowledge-assistant" - same naming
# convention. UNLIKE error-analyzer, this agent gets the SMALLEST possible tool grant, per its
# own design brief ("smallest possible permission set"): payment.lookup/payment.status (a
# specific payment's current state) and audit.search (what happened to it) - the exact three
# runtime questions the brief's own examples ask ("Is payment X currently FAILED?", "What is
# payment X status?", "What happened to payment X?"). routing.lookup/reconciliation.status are
# deliberately NOT granted - no runtime example in the brief asks a live routing/reconciliation
# question, and "how does routing/reconciliation work" is a documentation question this agent
# answers via RAG, never via a tool call. capabilities omits ROUTING_ANALYSIS/
# RECONCILIATION_ANALYSIS for the same reason (capabilities are descriptive metadata only, not a
# security boundary - see AgentCapability's own javadoc - but should still describe what this
# agent actually does). prompt-key references PAYMENT_KNOWLEDGE_ASSISTANT (V1_0_5, Phase 4.3) -
# NOT PAYMENTX_KNOWLEDGE_ASSISTANT (V1_0_2, RAG Service's own unrelated internal synthesis
# prompt, unchanged).
agents:
  default-agent-id: default
  definitions:
    - agent-id: default
      name: PaymentX General Assistant
      description: >-
        The original Phase 3.8 general-purpose agent - RAG knowledge retrieval plus read-only
        payment/routing/reconciliation/audit lookups. Preserved unchanged as the platform default
        so every pre-Phase-4.1 caller keeps working exactly as before.
      version: "1.0"
      capabilities: PAYMENT_ANALYSIS,ROUTING_ANALYSIS,RECONCILIATION_ANALYSIS,KNOWLEDGE_RETRIEVAL
      allowed-tools: payment.lookup,payment.status,routing.lookup,reconciliation.status,audit.search
      prompt-key: PAYMENTX_AGENT_ORCHESTRATOR
      risk-level: LOW
      enabled: true
    - agent-id: error-analyzer
      name: PaymentX Error Analyzer
      description: >-
        Evidence-first investigation of a payment failure - collects authoritative PaymentX
        evidence via MCP (payment status/failure reason, audit history, routing rule state,
        reconciliation batch status) and, where real knowledge content exists, PaymentX
        documentation via RAG, then produces a root-cause explanation that is never permitted to
        override or invent evidence the tools themselves did not return.
      version: "1.0"
      capabilities: PAYMENT_ANALYSIS,ROUTING_ANALYSIS,RECONCILIATION_ANALYSIS,KNOWLEDGE_RETRIEVAL
      allowed-tools: payment.lookup,payment.status,routing.lookup,reconciliation.status,audit.search
      prompt-key: PAYMENT_ERROR_ANALYSIS
      risk-level: LOW
      enabled: true
    - agent-id: knowledge-assistant
      name: PaymentX Knowledge Assistant
      description: >-
        Read-only, RAG-first assistant that explains how PaymentX works (validation, routing,
        idempotency, reconciliation, schemes, Kafka's role) using trusted PaymentX knowledge, and
        - only for a specific payment's current state - authorized read-only MCP evidence
        (payment.lookup, payment.status, audit.search). Never performs a write operation.
      version: "1.0"
      capabilities: KNOWLEDGE_RETRIEVAL,PAYMENT_ANALYSIS
      allowed-tools: payment.lookup,payment.status,audit.search
      prompt-key: PAYMENT_KNOWLEDGE_ASSISTANT
      risk-level: LOW
      enabled: true
    - agent-id: fraud-detection-agent
      name: PaymentX Fraud/Risk Analysis Agent
      description: >-
        Strictly read-only agent that performs conservative, evidence-based potential-risk
        analysis for a specific payment - never a confirmed-fraud determination, since PaymentX
        has no ML fraud model, scoring engine, anomaly detection engine, or historical fraud
        labels (Phase 4.5.0 discovery). Gathers authoritative evidence via payment.lookup,
        payment.status, audit.search (participant/date-scoped event frequency), and
        reconciliation.status, combined with the Phase 4.5.1 fraud/risk RAG knowledge corpus.
        Excludes routing.lookup (no fraud relevance found) and database.statistics (platform-wide
        only, no participant scoping). No participant.lookup tool exists on the platform; the
        agent must state this limitation explicitly rather than imply it can query participant
        blacklist/status directly. Never performs a write operation.
      version: "1.0"
      capabilities: RISK_ANALYSIS,PAYMENT_ANALYSIS,RECONCILIATION_ANALYSIS,KNOWLEDGE_RETRIEVAL
      allowed-tools: payment.lookup,payment.status,audit.search,reconciliation.status
      prompt-key: PAYMENT_FRAUD_RISK_ANALYSIS
      risk-level: LOW
      enabled: true
    - agent-id: reconciliation-agent
      name: PaymentX Reconciliation Agent
      description: >-
        Strictly read-only agent that analyzes reconciliation state and discrepancies for a
        specific payment or batch - never automatically corrects, resolves, reconciles, or
        reprocesses anything. Gathers authoritative evidence via payment.lookup, payment.status,
        audit.search, and reconciliation.status (Phase 4.6.0: now also resolvable by
        paymentReference, not only batchId - see reconciliation-service's new
        GET /api/v1/reconciliation/records endpoint), combined with a dedicated reconciliation
        RAG knowledge corpus. Excludes routing.lookup (no reconciliation relevance) and
        database.statistics (platform-wide only, no per-payment/per-batch scoping). Cannot
        retrieve individual mismatch descriptions/resolution notes or full batch CSV reports -
        no MCP tool wraps those endpoints. Never performs a write operation.
      version: "1.0"
      capabilities: RECONCILIATION_ANALYSIS,PAYMENT_ANALYSIS,KNOWLEDGE_RETRIEVAL
      allowed-tools: payment.lookup,payment.status,audit.search,reconciliation.status
      prompt-key: PAYMENT_RECONCILIATION_ANALYSIS
      risk-level: LOW
      enabled: true
    - agent-id: incident-rca-agent
      name: PaymentX Incident RCA Agent
      description: >-
        Strictly read-only agent that performs evidence-based incident root-cause analysis -
        distinguishing FACT from CORRELATION from HYPOTHESIS, and classifying any proposed cause
        as CONFIRMED_ROOT_CAUSE, LIKELY_ROOT_CAUSE, POSSIBLE_ROOT_CAUSE, or INSUFFICIENT_CONTEXT.
        Never presents a correlation as a confirmed cause. Gathers authoritative evidence via
        payment.lookup (including its Phase 4.8.0 includeHistory timeline extension),
        payment.status, audit.search (cross-service correlation by correlationId/reference),
        routing.lookup, and reconciliation.status, combined with the Phase 4.8.0 incident-RCA
        methodology corpus and the existing error-analyzer knowledge base. Never automatically
        remediates, restarts a service, alters configuration, or executes an operational
        command - "Recommended Investigation Steps" in its own output are informational only.
      version: "1.0"
      capabilities: LOG_ANALYSIS,PAYMENT_ANALYSIS,ROUTING_ANALYSIS,RECONCILIATION_ANALYSIS,KNOWLEDGE_RETRIEVAL
      allowed-tools: payment.lookup,payment.status,audit.search,routing.lookup,reconciliation.status
      prompt-key: PAYMENT_INCIDENT_RCA
      risk-level: LOW
      enabled: true
    - agent-id: database-analysis-agent
      name: PaymentX Database Analysis Agent
      description: >-
        Strictly read-only agent that analyzes PaymentX database evidence - a specific payment's
        record and event history (payment.lookup, payment.status, audit.search), reconciliation
        state (reconciliation.status), and aggregate/schema-level evidence (database.statistics:
        payment status distribution, table row counts) - combined with trusted PaymentX schema
        knowledge via RAG. Never executes SQL, never modifies any data; read-only enforcement lives
        entirely in Control Center's own hardcoded/parameterized queries and MCP's two-gate
        authorization chain, never in this agent's prompt.
      version: "1.0"
      capabilities: DATABASE_ANALYSIS,PAYMENT_ANALYSIS,RECONCILIATION_ANALYSIS,KNOWLEDGE_RETRIEVAL
      allowed-tools: payment.lookup,payment.status,audit.search,reconciliation.status,database.statistics
      prompt-key: PAYMENT_DATABASE_ANALYSIS
      risk-level: LOW
      enabled: true
    - agent-id: payment-test-agent
      name: PaymentX Payment Test/Validation Agent
      description: >-
        Strictly read-only agent that validates and explains the observed state of a specific
        payment - consolidating the payment-validation slice error-analyzer/database-analysis-
        agent/reconciliation-agent each partially cover into one purpose-built experience.
        Gathers authoritative evidence via payment.lookup, payment.status, audit.search, and
        reconciliation.status, classifying every statement as FACT (directly read from a tool
        result) or HYPOTHESIS (an inference offered to explain facts), and the overall outcome as
        VALID, INCONSISTENT, or INSUFFICIENT_CONTEXT. Never fabricates payment state and never
        claims a payment succeeded/failed/settled without authoritative evidence. Excludes
        routing.lookup and database.statistics (no per-payment validation relevance). Never
        performs a write operation - no MCP write tool exists on the platform at all.
      version: "1.0"
      capabilities: PAYMENT_ANALYSIS,RECONCILIATION_ANALYSIS,KNOWLEDGE_RETRIEVAL
      allowed-tools: payment.lookup,payment.status,audit.search,reconciliation.status
      prompt-key: PAYMENT_TEST_VALIDATION
      risk-level: LOW
      enabled: true

# One real Resilience4j instance per downstream dependency (rag/mcp/prompt/llm) - same "four separate
# instances, not one shared instance" + RetryConfigCustomizer-reads-a-per-instance-retryable-flag pattern
# every prior AI Platform phase already established (see config/ResilienceConfig.java's javadoc).
resilience4j:
  circuitbreaker:
    instances:
      ragService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
      mcpGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
      promptService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
      llmService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      ragService:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait-factor: true
      mcpGateway:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait-factor: true
      promptService:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait-factor: true
      llmService:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait-factor: true
