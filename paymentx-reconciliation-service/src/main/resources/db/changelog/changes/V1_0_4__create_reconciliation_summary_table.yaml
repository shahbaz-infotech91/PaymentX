databaseChangeLog:
  - changeSet:
      id: V1_0_4-create-reconciliation-summary-table
      author: reconciliation-service
      comment: One immutable aggregate snapshot per batch.
      changes:
        - createTable:
            tableName: reconciliation_summary
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: batch_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: total_records
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: matched_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: missing_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: duplicate_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: amount_mismatch_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: currency_mismatch_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status_mismatch_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: settlement_delay_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: late_settlement_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: orphan_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: unexpected_settlement_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: generated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: reconciliation_summary
            baseColumnNames: batch_id
            referencedTableName: reconciliation_batch
            referencedColumnNames: id
            constraintName: fk_reconciliation_summary_batch
            onDelete: CASCADE
