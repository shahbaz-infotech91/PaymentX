# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# This is the Liquibase master changelog for the validation service.
# It lists every schema-migration changeset in the order they must be
# applied - Liquibase reads this file on startup and runs any
# changeset not yet recorded in its own tracking table, so the
# database schema always matches what this service's entities expect.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Ye validation service ka Liquibase master changelog hai. Isme har
# schema-migration changeset us order me listed hai jisme unhe apply
# hona chahiye - Liquibase startup pe ye file padhti hai aur jo bhi
# changeset abhi tak apply nahi hua use chala deti hai, taaki database
# schema hamesha is service ki entities ke expectations se match kare.
# ====================================================================

databaseChangeLog:

  - include:
      file: db/changelog/changes/V1_0_0__create_participant_table.yaml

  - include:
      file: db/changelog/changes/V1_0_1__create_participant_scheme_table.yaml

  - include:
      file: db/changelog/changes/V1_0_2__create_business_rule_table.yaml

  - include:
      file: db/changelog/changes/V1_0_3__create_blacklist_table.yaml

  - include:
      file: db/changelog/changes/V1_0_4__create_certificate_table.yaml

  - include:
      file: db/changelog/changes/V1_0_5__create_idempotency_table.yaml

  - include:
      file: db/changelog/changes/V1_0_6__create_validation_log_table.yaml

  - include:
      file: db/changelog/changes/V1_0_7__seed_default_data.yaml
