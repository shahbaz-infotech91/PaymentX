databaseChangeLog:
  - changeSet:
      id: V1_0_2-create-business-rule-table
      author: shahbaz
      comment: >
        DB-backed configurable rules (amount limits per scheme) so limits
        can change without a code deploy. See seed data in V1_0_7 for the
        actual InstantPayment/CARD_PAYMENT/REAL_TIME_PAYMENT default limits.
      changes:
        - createTable:
            tableName: business_rule
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rule_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: rule_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: scheme
                  type: VARCHAR(32)
                  defaultValue: ALL
                  constraints:
                    nullable: false
              - column:
                  name: min_amount
                  type: DECIMAL(18,2)
              - column:
                  name: max_amount
                  type: DECIMAL(18,2)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_business_rule_scheme_active
            tableName: business_rule
            columns:
              - column:
                  name: scheme
              - column:
                  name: active
