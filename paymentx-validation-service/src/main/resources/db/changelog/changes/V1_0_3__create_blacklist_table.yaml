databaseChangeLog:
  - changeSet:
      id: V1_0_3-create-blacklist-table
      author: shahbaz
      changes:
        - createTable:
            tableName: blacklist
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: bank_id
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: blacklisted_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: blacklisted_by
                  type: VARCHAR(64)
        - addUniqueConstraint:
            tableName: blacklist
            columnNames: account_number, bank_id
            constraintName: uq_blacklist_account_bank
        - createIndex:
            indexName: idx_blacklist_lookup
            tableName: blacklist
            columns:
              - column:
                  name: account_number
              - column:
                  name: bank_id
