# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# Development/demo seed data - ONE minimal prompt, PAYMENT_ERROR_
# ANALYSIS, matching Step 22 of the Phase 3.2 brief: "prefer a minimal
# PAYMENT_ERROR_ANALYSIS prompt because it will be used by future
# RAG/LLM work." This is real configuration data (a prompt template is
# legitimate config, not a fake business result - see Step 31), but it
# is explicitly DRAFT, not ACTIVE - this migration does NOT activate
# it, matching PromptServiceImpl's own rule that nothing is ever
# auto-activated (an operator must call POST .../versions/1/activate
# explicitly). No fake AI response, no fake payment data anywhere in
# this file - it is a template with placeholders, not a rendered
# example. Fixed UUIDs (not gen_random_uuid()) are used deliberately
# so this seed is deterministic and referenceable in a test/manual
# smoke check without first querying for the generated id. Uses a `|`
# literal block scalar (not `>` folded) for the SQL text specifically
# so the prompt content's intentional line breaks survive into the
# actual stored string - a folded scalar would collapse the field list
# (Payment Reference / Status / Error Code / Error Message) onto one
# line, which is not the intended prompt formatting.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Development/demo seed data - EK minimal prompt, PAYMENT_ERROR_
# ANALYSIS, Phase 3.2 brief ke Step 22 se match karte hue: "ek minimal
# PAYMENT_ERROR_ANALYSIS prompt prefer karo kyunki ye future RAG/LLM
# work me use hoga." Ye real configuration data hai (ek prompt template
# legitimate config hai, fake business result nahi - Step 31 dekho),
# lekin ye explicitly DRAFT hai, ACTIVE nahi - ye migration ise
# activate NAHI karti, PromptServiceImpl ke apne rule se match karte
# hue ki kuch bhi kabhi auto-activate nahi hota (ek operator ko
# explicitly POST .../versions/1/activate call karna hota hai). Is file
# me kahin bhi koi fake AI response, koi fake payment data nahi hai -
# ye placeholders wala ek template hai, ek rendered example nahi. Fixed
# UUIDs (gen_random_uuid() nahi) jaan-boojh kar use kiye gaye hain
# taaki ye seed deterministic ho. `>` folded ke bajaye `|` literal
# block scalar use kiya gaya hai SQL text ke liye specifically taaki
# prompt content ke intentional line breaks actual stored string me
# survive karein - ek folded scalar field list (Payment Reference /
# Status / Error Code / Error Message) ko ek line par collapse kar
# deta, jo intended prompt formatting nahi hai.
# ====================================================================

databaseChangeLog:
  - changeSet:
      id: V1_0_1-seed-payment-error-analysis-prompt
      author: prompt-service
      comment: >
        Seeds PAYMENT_ERROR_ANALYSIS as a DRAFT template + version 1 -
        never activated by this migration.
      changes:
        - sql:
            sql: >
              INSERT INTO prompt_template (id, prompt_key, name, description, type, created_by, updated_by)
              VALUES (
                '11111111-1111-1111-1111-111111111111',
                'PAYMENT_ERROR_ANALYSIS',
                'Payment Error Analysis',
                'Explains why a payment failed, using only the payment/validation/audit data supplied in the request - development seed, DRAFT until explicitly activated.',
                'SYSTEM',
                'SYSTEM',
                'SYSTEM'
              );
        - sql:
            sql: |
              INSERT INTO prompt_version (id, prompt_template_id, version_number, content, status, variables, created_by, updated_by)
              VALUES (
                '22222222-2222-2222-2222-222222222222',
                '11111111-1111-1111-1111-111111111111',
                1,
                'You are a PaymentX payment operations assistant.

              Analyze the following payment:

              Payment Reference: {{paymentReference}}
              Status: {{status}}
              Error Code: {{errorCode}}
              Error Message: {{errorMessage}}

              Explain:

              1. Root cause
              2. Evidence
              3. Recommended action

              Do not invent facts that are not present in the supplied data.',
                'DRAFT',
                '[
                  {"name": "paymentReference", "required": true, "description": "The payment reference being analyzed, e.g. PMT-123"},
                  {"name": "status", "required": true, "description": "The payment status"},
                  {"name": "errorCode", "required": true, "description": "The error/failure code associated with the payment"},
                  {"name": "errorMessage", "required": true, "description": "The human-readable failure reason"}
                ]'::jsonb,
                'SYSTEM',
                'SYSTEM'
              );
