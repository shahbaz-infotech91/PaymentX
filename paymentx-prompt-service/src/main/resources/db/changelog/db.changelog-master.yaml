# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# This is the Liquibase master changelog for Prompt Service. It lists
# every schema-migration changeset in the order they must be applied -
# Liquibase reads this file on startup and runs any changeset not yet
# recorded in its own tracking table, so the database schema always
# matches what this service's entities expect. Runs against the
# shared `paymentx_ai` database (see application-dev.yml) - this
# service's changesets only ever touch prompt_template/prompt_version,
# never a table another AI Platform service owns.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Ye Prompt Service ka Liquibase master changelog hai. Isme har
# schema-migration changeset us order me listed hai jisme unhe apply
# hona chahiye - Liquibase startup pe ye file padhti hai aur jo bhi
# changeset abhi tak apply nahi hua use chala deti hai, taaki database
# schema hamesha is service ki entities ke expectations se match kare.
# Shared `paymentx_ai` database ke against chalta hai
# (application-dev.yml dekho) - is service ke changesets sirf
# prompt_template/prompt_version ko touch karte hain, kisi doosri AI
# Platform service ki table ko kabhi nahi.
# ====================================================================

databaseChangeLog:

  - include:
      file: db/changelog/changes/V1_0_0__create_prompt_tables.yaml

  - include:
      file: db/changelog/changes/V1_0_1__seed_payment_error_analysis_prompt.yaml

  - include:
      file: db/changelog/changes/V1_0_2__seed_payment_knowledge_assistant_prompt.yaml

  - include:
      file: db/changelog/changes/V1_0_3__seed_agent_orchestrator_prompt.yaml
