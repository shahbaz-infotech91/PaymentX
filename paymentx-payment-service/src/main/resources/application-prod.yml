# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# This configuration file contains runtime configuration required by
# Payment Service (production profile - all connection details injected via environment variables, no hardcoded secrets). It configures database, Kafka, Redis, security,
# observability, and application-specific settings this service reads
# on startup - other services never read this file directly, each
# service owns and loads only its own configuration.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Is file me Payment Service (production profile - all connection details injected via environment variables, no hardcoded secrets) ki runtime configuration hai. Isme
# database, Kafka, Redis, security, observability, aur is service ke
# apne settings hain jo startup pe padhe jaate hain - dusri services
# ye file kabhi seedhe nahi padhti, har service sirf apni configuration
# khud load karti hai.
# ====================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Connection pool sizing is a real production tuning decision, not a
      # default to leave untouched. Formula rule of thumb (per HikiCP docs):
      # connections = ((core_count * 2) + effective_spindle_count). For a
      # payment service under real load, undersized pools cause request
      # queuing that LOOKS like a slow database but is actually pool
      # starvation - a classic production incident root cause.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

server:
  port: 8083

logging:
  level:
    com.paymentx.payment: INFO

management:
  tracing:
    sampling:
      probability: 0.1
