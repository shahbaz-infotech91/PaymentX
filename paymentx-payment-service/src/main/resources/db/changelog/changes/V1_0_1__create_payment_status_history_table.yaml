databaseChangeLog:
  - changeSet:
      id: V1_0_1-create-payment-status-history-table
      author: shahbaz
      comment: >
        Deliberately NO updated_at/updated_by/version columns - this table
        is append-only by design. A row here is a fact about something
        that happened at a point in time; it should never be mutated after
        insert. Omitting the update-tracking columns is a structural
        guarantee against accidental mutation, not an inconsistency with
        the "standard columns" convention used on mutable tables.
      changes:
        - createTable:
            tableName: payment_status_history
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_status_history_payment
                    references: payment(id)
              - column:
                  name: from_status
                  type: VARCHAR(20)
              - column:
                  name: to_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(512)
              - column:
                  name: transitioned_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_status_history_payment_id
            tableName: payment_status_history
            columns:
              - column:
                  name: payment_id
