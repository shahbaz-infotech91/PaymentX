databaseChangeLog:
  - changeSet:
      id: V1_0_2-create-payment-retry-table
      author: shahbaz
      comment: >
        Tracks individual retry attempts. Mutable (a SCHEDULED attempt
        becomes SUCCEEDED or EXHAUSTED), so it gets the full standard
        column set including version - concurrent retry-scheduler ticks
        must not silently overwrite each other's updates to the same row.
      changes:
        - createTable:
            tableName: payment_retry
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_retry_payment
                    references: payment(id)
              - column:
                  name: retry_attempt
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: retry_reason
                  type: VARCHAR(512)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: next_retry_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_attempted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: payment_retry
            columnNames: payment_id, retry_attempt
            constraintName: uq_payment_retry_attempt

        # THE hot-path index for this table: the retry scheduler's core
        # query is "give me every SCHEDULED retry whose next_retry_at has
        # elapsed" - a composite index on exactly these two columns turns
        # that from a full scan into an index range scan, which matters
        # once this table has millions of historical retry rows.
        - createIndex:
            indexName: idx_payment_retry_status_next_retry
            tableName: payment_retry
            columns:
              - column:
                  name: status
              - column:
                  name: next_retry_at
