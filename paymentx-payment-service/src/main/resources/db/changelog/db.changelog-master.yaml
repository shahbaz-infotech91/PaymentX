# ====================================================================
# ENGLISH
# --------------------------------------------------------------------
# This is the Liquibase master changelog for the payment service.
# It lists every schema-migration changeset in the order they must be
# applied - Liquibase reads this file on startup and runs any
# changeset not yet recorded in its own tracking table, so the
# database schema always matches what this service's entities expect.
#
# ====================================================================
# HINGLISH
# --------------------------------------------------------------------
# Ye payment service ka Liquibase master changelog hai. Isme har
# schema-migration changeset us order me listed hai jisme unhe apply
# hona chahiye - Liquibase startup pe ye file padhti hai aur jo bhi
# changeset abhi tak apply nahi hua use chala deti hai, taaki database
# schema hamesha is service ki entities ke expectations se match kare.
# ====================================================================

databaseChangeLog:
  # Order matters: payment MUST exist before any table with a foreign key
  # referencing payment(id).
  - include:
      file: db/changelog/changes/V1_0_0__create_payment_table.yaml

  - include:
      file: db/changelog/changes/V1_0_1__create_payment_status_history_table.yaml

  - include:
      file: db/changelog/changes/V1_0_2__create_payment_retry_table.yaml

  - include:
      file: db/changelog/changes/V1_0_3__create_payment_settlement_table.yaml

  - include:
      file: db/changelog/changes/V1_0_4__create_payment_outbox_table.yaml

  - include:
      file: db/changelog/changes/V1_0_5__create_payment_audit_table.yaml

  # --- Batch 1 updates (ParticipantId rename, Money, PaymentType/Channel,
  #     correlationId, retry/settlement field alignment) ---
  - include:
      file: db/changelog/changes/V1_0_6__rename_payment_bank_id_to_participant_id.yaml

  - include:
      file: db/changelog/changes/V1_0_7__add_payment_type_channel_correlation_id.yaml

  - include:
      file: db/changelog/changes/V1_0_8__improve_payment_retry_table.yaml

  - include:
      file: db/changelog/changes/V1_0_9__improve_payment_settlement_table.yaml
